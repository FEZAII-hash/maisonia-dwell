<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Property — Maisonia Admin</title>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="logo">Maison<span>ia</span></div>
  <ul class="side-nav">
    <li><a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
    <li><a href="properties-manager.html" class="active"><i class="fa-solid fa-building"></i> Properties</a></li>
    <li><a href="add-property.html"><i class="fa-solid fa-plus"></i> Add Property</a></li>
    <li><a href="messages.html"><i class="fa-solid fa-envelope"></i> Messages</a></li>
  </ul>
  <button class="logout-btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</aside>

<main class="main">
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:14px"><button class="menu-toggle-admin" id="menu"><i class="fa-solid fa-bars"></i></button><h1>Edit Property</h1></div>
    <a href="properties-manager.html" class="btn btn-dark"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="panel" id="prop-form">
    <div class="form-grid">
      <div class="field form-full"><label>Title</label><input name="title" required></div>
      <div class="field form-full"><label>Description</label><textarea name="description" required></textarea></div>
      <div class="field"><label>Price</label><input name="price" type="number" required></div>
      <div class="field"><label>Property Type</label><select name="type" required><option>Apartment</option><option>Villa</option><option>House</option><option>Studio</option><option>Penthouse</option></select></div>
      <div class="field"><label>City</label><input name="city" required></div>
      <div class="field"><label>Address</label><input name="address" required></div>
      <div class="field"><label>Bedrooms</label><input name="bedrooms" type="number"></div>
      <div class="field"><label>Bathrooms</label><input name="bathrooms" type="number"></div>
      <div class="field"><label>Area (m²)</label><input name="area" type="number"></div>
      <div class="field"><label>Amenities (comma-separated)</label><input name="amenities"></div>

      <div class="field form-full">
        <label>Current images</label>
        <div class="preview-grid" id="existing"></div>
      </div>
      <div class="field form-full">
        <label>Add more images (optional)</label>
        <div class="upload-zone" id="drop"><i class="fa-solid fa-cloud-arrow-up"></i><p>Click to upload</p>
          <input type="file" id="files" multiple accept="image/*" hidden></div>
        <div class="preview-grid" id="preview"></div>
      </div>
      <div class="field form-full">
        <label>Location</label>
        <div id="edit-map"></div>
        <p style="margin-top:8px;font-size:.85rem;color:#64748b" id="coords"></p>
      </div>
    </div>
    <div style="margin-top:20px;display:flex;gap:12px;justify-content:flex-end">
      <a href="properties-manager.html" class="btn" style="background:#e2e8f0;color:#0F172A">Cancel</a>
      <button type="submit" class="btn btn-primary" id="submit-btn"><i class="fa-solid fa-floppy-disk"></i> Update Property</button>
    </div>
  </form>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { requireAdmin, logoutAdmin } from '../js/auth.js';
import { getProperty, updateProperty, uploadImages } from '../js/properties.js';
import { locationPicker } from '../js/map.js';
import { toast } from '../js/ui.js';

await requireAdmin();
document.getElementById('logout').addEventListener('click', async ()=>{await logoutAdmin();location.href='../login.html'});
document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

const id = new URLSearchParams(location.search).get('id');
if (!id) location.href='properties-manager.html';
const p = await getProperty(id);
if (!p) { toast('Property not found','error'); location.href='properties-manager.html'; }

const form = document.getElementById('prop-form');
['title','description','price','type','city','address','bedrooms','bathrooms','area'].forEach(k => form.elements[k].value = p[k] ?? '');
form.elements.amenities.value = (p.amenities||[]).join(', ');

let images = [...(p.images||[])];
const existing = document.getElementById('existing');
function renderExisting(){
  existing.innerHTML = images.map((u,i)=>`<div class="prev"><img src="${u}"><span class="rm" data-x="${i}">✕</span></div>`).join('') || '<p style="color:#94a3b8;font-size:.88rem">No images</p>';
  existing.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>{images.splice(+b.dataset.x,1);renderExisting();}));
}
renderExisting();

let coords = (p.lat && p.lng) ? {lat:p.lat,lng:p.lng} : null;
document.getElementById('coords').textContent = coords ? `📍 ${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)}` : 'No location';
locationPicker('edit-map', c=>{coords=c;document.getElementById('coords').textContent=`📍 ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`;}, coords);

const files = document.getElementById('files');
const preview = document.getElementById('preview');
let chosen = [];
document.getElementById('drop').addEventListener('click',()=>files.click());
files.addEventListener('change',e=>{chosen=[...chosen,...Array.from(e.target.files)];renderPreview();});
function renderPreview(){
  preview.innerHTML = chosen.map((f,i)=>`<div class="prev"><img src="${URL.createObjectURL(f)}"><span class="rm" data-r="${i}">✕</span></div>`).join('');
  preview.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{chosen.splice(+b.dataset.r,1);renderPreview();}));
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.innerHTML='Saving…';
  try {
    let newUrls=[];
    if (chosen.length) newUrls = await uploadImages(chosen);
    const fd = new FormData(form);
    await updateProperty(id, {
      title:fd.get('title'), description:fd.get('description'),
      price:+fd.get('price'), type:fd.get('type'),
      city:fd.get('city'), address:fd.get('address'),
      bedrooms:+fd.get('bedrooms'), bathrooms:+fd.get('bathrooms'),
      area:+fd.get('area'),
      amenities:(fd.get('amenities')||'').split(',').map(s=>s.trim()).filter(Boolean),
      images:[...images, ...newUrls], lat:coords?.lat||null, lng:coords?.lng||null
    });
    toast('Property updated');
    setTimeout(()=>location.href='properties-manager.html',800);
  } catch(ex){
    toast('Failed: '+ex.message,'error');
    btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-floppy-disk"></i> Update Property';
  }
});
</script>
</body>
</html>
