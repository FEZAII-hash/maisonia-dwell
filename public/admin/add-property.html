<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Property — Maisonia Admin</title>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="logo">Maison<span>ia</span></div>
  <ul class="side-nav">
    <li><a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
    <li><a href="properties-manager.html"><i class="fa-solid fa-building"></i> Properties</a></li>
    <li><a href="add-property.html" class="active"><i class="fa-solid fa-plus"></i> Add Property</a></li>
    <li><a href="messages.html"><i class="fa-solid fa-envelope"></i> Messages</a></li>
    <li><a href="#"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
    <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
  </ul>
  <button class="logout-btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</aside>

<main class="main">
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:14px">
      <button class="menu-toggle-admin" id="menu"><i class="fa-solid fa-bars"></i></button>
      <h1>Add New Property</h1>
    </div>
    <a href="properties-manager.html" class="btn btn-dark"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>

  <form class="panel" id="prop-form">
    <div class="form-grid">
      <div class="field form-full"><label>Title *</label><input name="title" required placeholder="Modern villa with pool"></div>
      <div class="field form-full"><label>Description *</label><textarea name="description" required placeholder="Describe the property…"></textarea></div>
      <div class="field"><label>Price (USD / month) *</label><input name="price" type="number" min="0" required></div>
      <div class="field"><label>Property Type *</label><select name="type" required><option value="">Select…</option><option>Apartment</option><option>Villa</option><option>House</option><option>Studio</option><option>Penthouse</option></select></div>
      <div class="field"><label>City *</label><input name="city" required></div>
      <div class="field"><label>Address *</label><input name="address" required></div>
      <div class="field"><label>Bedrooms</label><input name="bedrooms" type="number" min="0" value="0"></div>
      <div class="field"><label>Bathrooms</label><input name="bathrooms" type="number" min="0" value="0"></div>
      <div class="field"><label>Area (m²)</label><input name="area" type="number" min="0" value="0"></div>
      <div class="field"><label>Amenities (comma-separated)</label><input name="amenities" placeholder="WiFi, Pool, Parking…"></div>

      <div class="field form-full">
        <label>Images *</label>
        <div class="upload-zone" id="drop">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <p><strong>Click or drag</strong> to upload images</p>
          <input type="file" id="files" accept="image/*" multiple hidden>
        </div>
        <div class="preview-grid" id="preview"></div>
      </div>

      <div class="field form-full">
        <label>Location (click map to set GPS)</label>
        <div id="admin-map"></div>
        <p style="margin-top:8px;font-size:.85rem;color:#64748b" id="coords">No location selected</p>
      </div>
    </div>
    <div style="margin-top:20px;display:flex;gap:12px;justify-content:flex-end">
      <a href="properties-manager.html" class="btn" style="background:#e2e8f0;color:#0F172A">Cancel</a>
      <button type="submit" class="btn btn-primary" id="submit-btn"><i class="fa-solid fa-floppy-disk"></i> Save Property</button>
    </div>
  </form>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { requireAdmin, logoutAdmin } from '../js/auth.js';
import { addProperty, uploadImages } from '../js/properties.js';
import { locationPicker } from '../js/map.js';
import { toast } from '../js/ui.js';

await requireAdmin();
document.getElementById('logout').addEventListener('click', async ()=>{await logoutAdmin();location.href='../login.html'});
document.getElementById('menu').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));

let coords = null;
locationPicker('admin-map', ({lat,lng})=>{
  coords={lat,lng};
  document.getElementById('coords').textContent = `📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
});

const files = document.getElementById('files');
const preview = document.getElementById('preview');
let chosen = [];
document.getElementById('drop').addEventListener('click', ()=>files.click());
files.addEventListener('change', e=>{
  chosen = [...chosen, ...Array.from(e.target.files)];
  renderPreview();
});
function renderPreview(){
  preview.innerHTML = chosen.map((f,i)=>`<div class="prev"><img src="${URL.createObjectURL(f)}"><span class="rm" data-rm="${i}">✕</span></div>`).join('');
  preview.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{chosen.splice(+b.dataset.rm,1);renderPreview();}));
}

document.getElementById('prop-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if (!chosen.length) return toast('Please upload at least one image','error');
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.innerHTML='Uploading…';
  try {
    const urls = await uploadImages(chosen);
    const fd = new FormData(e.target);
    await addProperty({
      title:fd.get('title'), description:fd.get('description'),
      price:+fd.get('price'), type:fd.get('type'),
      city:fd.get('city'), address:fd.get('address'),
      bedrooms:+fd.get('bedrooms'), bathrooms:+fd.get('bathrooms'),
      area:+fd.get('area'),
      amenities:(fd.get('amenities')||'').split(',').map(s=>s.trim()).filter(Boolean),
      images:urls, lat:coords?.lat||null, lng:coords?.lng||null
    });
    toast('Property added successfully');
    setTimeout(()=>location.href='properties-manager.html',900);
  } catch(ex) {
    console.error(ex); toast('Failed to save: '+ex.message,'error');
    btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-floppy-disk"></i> Save Property';
  }
});
</script>
</body>
</html>
