<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — Maisonia Admin</title>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="logo">Maison<span>ia</span></div>
  <ul class="side-nav">
    <li><a href="admin-dashboard.html" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
    <li><a href="properties-manager.html"><i class="fa-solid fa-building"></i> Properties</a></li>
    <li><a href="add-property.html"><i class="fa-solid fa-plus"></i> Add Property</a></li>
    <li><a href="messages.html"><i class="fa-solid fa-envelope"></i> Messages</a></li>
    <li><a href="#"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
    <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
  </ul>
  <button class="logout-btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</aside>

<main class="main">
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:14px">
      <button class="menu-toggle-admin" id="menu"><i class="fa-solid fa-bars"></i></button>
      <h1>Dashboard</h1>
    </div>
    <div class="user-chip"><div class="avatar" id="avatar">A</div><span id="email" style="font-size:.9rem">admin</span></div>
  </div>

  <section class="stat-grid">
    <div class="stat-card"><div class="ico gold"><i class="fa-solid fa-house"></i></div><div><h3 id="s-props">0</h3><p>Total Properties</p></div></div>
    <div class="stat-card"><div class="ico turq"><i class="fa-solid fa-envelope"></i></div><div><h3 id="s-msgs">0</h3><p>Messages</p></div></div>
    <div class="stat-card"><div class="ico green"><i class="fa-solid fa-eye"></i></div><div><h3 id="s-unread">0</h3><p>Unread Messages</p></div></div>
    <div class="stat-card"><div class="ico navy"><i class="fa-solid fa-city"></i></div><div><h3 id="s-cities">0</h3><p>Cities Covered</p></div></div>
  </section>

  <div class="panel">
    <h2>Recent Properties</h2>
    <div style="overflow-x:auto">
      <table><thead><tr><th></th><th>Title</th><th>City</th><th>Price</th><th>Beds</th><th>Type</th></tr></thead>
        <tbody id="recent-tbl"><tr><td colspan="6" style="text-align:center;padding:30px;color:#94a3b8">Loading…</td></tr></tbody></table>
    </div>
  </div>
</main>

<script type="module">
import { requireAdmin, logoutAdmin } from '../js/auth.js';
import { watchProperties } from '../js/properties.js';
import { db, collection, onSnapshot } from '../js/firebase-config.js';
import { fmtPrice, escapeHtml } from '../js/ui.js';

const user = await requireAdmin();
document.getElementById('email').textContent = user.email;
document.getElementById('avatar').textContent = (user.email||'A')[0].toUpperCase();
document.getElementById('logout').addEventListener('click', async ()=>{await logoutAdmin();location.href='../login.html'});
document.getElementById('menu').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));

watchProperties(items=>{
  document.getElementById('s-props').textContent = items.length;
  document.getElementById('s-cities').textContent = new Set(items.map(i=>i.city).filter(Boolean)).size;
  document.getElementById('recent-tbl').innerHTML = items.slice(0,8).map(p=>`
    <tr>
      <td><img src="${(p.images||[])[0]||'https://placehold.co/60x60'}" class="thumb"></td>
      <td>${escapeHtml(p.title)}</td>
      <td>${escapeHtml(p.city||'')}</td>
      <td>${fmtPrice(p.price)}</td>
      <td>${p.bedrooms||0}</td>
      <td>${escapeHtml(p.type||'')}</td>
    </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;padding:30px;color:#94a3b8">No properties yet</td></tr>';
});

onSnapshot(collection(db,'messages'), snap=>{
  const items = snap.docs.map(d=>d.data());
  document.getElementById('s-msgs').textContent = items.length;
  document.getElementById('s-unread').textContent = items.filter(m=>!m.read).length;
});
</script>
</body>
</html>
