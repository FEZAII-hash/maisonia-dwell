<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages — Maisonia Admin</title>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="logo">Maison<span>ia</span></div>
  <ul class="side-nav">
    <li><a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
    <li><a href="properties-manager.html"><i class="fa-solid fa-building"></i> Properties</a></li>
    <li><a href="add-property.html"><i class="fa-solid fa-plus"></i> Add Property</a></li>
    <li><a href="messages.html" class="active"><i class="fa-solid fa-envelope"></i> Messages</a></li>
  </ul>
  <button class="logout-btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</aside>

<main class="main">
  <div class="top-bar"><div style="display:flex;align-items:center;gap:14px"><button class="menu-toggle-admin" id="menu"><i class="fa-solid fa-bars"></i></button><h1>Messages</h1></div></div>
  <div class="panel">
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Status</th><th>From</th><th>Email</th><th>Property</th><th>Message</th><th>Actions</th></tr></thead>
        <tbody id="tbl"><tr><td colspan="6" style="text-align:center;padding:30px;color:#94a3b8">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script type="module">
import { requireAdmin, logoutAdmin } from '../js/auth.js';
import { db, collection, doc, onSnapshot, query, orderBy, updateDoc, deleteDoc } from '../js/firebase-config.js';
import { escapeHtml, toast } from '../js/ui.js';

await requireAdmin();
document.getElementById('logout').addEventListener('click',async()=>{await logoutAdmin();location.href='../login.html'});
document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

const tbl=document.getElementById('tbl');
const q = query(collection(db,'messages'), orderBy('createdAt','desc'));
onSnapshot(q, snap=>{
  const items = snap.docs.map(d=>({id:d.id,...d.data()}));
  if (!items.length){tbl.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px;color:#94a3b8">No messages yet</td></tr>';return;}
  tbl.innerHTML = items.map(m=>`
    <tr>
      <td><span class="badge ${m.read?'read':'new'}">${m.read?'Read':'New'}</span></td>
      <td>${escapeHtml(m.name||'')}<br><small style="color:#94a3b8">${escapeHtml(m.phone||'')}</small></td>
      <td>${escapeHtml(m.email||'')}</td>
      <td>${escapeHtml(m.propertyTitle||m.source||'-')}</td>
      <td style="max-width:340px">${escapeHtml(m.message||'')}</td>
      <td>
        ${m.read?'':'<button class="action-btn edit" data-read="'+m.id+'"><i class="fa-solid fa-check"></i> Mark read</button>'}
        <button class="action-btn delete" data-del="${m.id}"><i class="fa-solid fa-trash"></i></button>
      </td>
    </tr>`).join('');
  tbl.querySelectorAll('[data-read]').forEach(b=>b.addEventListener('click',async()=>{
    try{await updateDoc(doc(db,'messages',b.dataset.read),{read:true});toast('Marked as read');}catch{toast('Failed','error');}
  }));
  tbl.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    if (!confirm('Delete this message?')) return;
    try{await deleteDoc(doc(db,'messages',b.dataset.del));toast('Deleted');}catch{toast('Failed','error');}
  }));
});
</script>
</body>
</html>
