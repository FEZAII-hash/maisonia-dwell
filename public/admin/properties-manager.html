<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Properties — Maisonia Admin</title>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="logo">Maison<span>ia</span></div>
  <ul class="side-nav">
    <li><a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
    <li><a href="properties-manager.html" class="active"><i class="fa-solid fa-building"></i> Properties</a></li>
    <li><a href="add-property.html"><i class="fa-solid fa-plus"></i> Add Property</a></li>
    <li><a href="messages.html"><i class="fa-solid fa-envelope"></i> Messages</a></li>
  </ul>
  <button class="logout-btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</aside>

<main class="main">
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:14px"><button class="menu-toggle-admin" id="menu"><i class="fa-solid fa-bars"></i></button><h1>Properties</h1></div>
    <a href="add-property.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Property</a>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <input class="search-input" id="search" placeholder="Search properties…">
      <select class="search-input" id="sort" style="width:200px">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="price-asc">Price low → high</option>
        <option value="price-desc">Price high → low</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th></th><th>Title</th><th>City</th><th>Price</th><th>Beds</th><th>Baths</th><th>Type</th><th>Actions</th></tr></thead>
        <tbody id="tbl"><tr><td colspan="8" style="text-align:center;padding:30px;color:#94a3b8">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="pag"></div>
  </div>
</main>

<script type="module">
import { requireAdmin, logoutAdmin } from '../js/auth.js';
import { watchProperties, deleteProperty } from '../js/properties.js';
import { fmtPrice, escapeHtml, toast } from '../js/ui.js';

await requireAdmin();
document.getElementById('logout').addEventListener('click',async()=>{await logoutAdmin();location.href='../login.html'});
document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

const PAGE=10;
let all=[], filtered=[], page=1;
const tbl=document.getElementById('tbl'), pag=document.getElementById('pag');

function render(){
  if (!filtered.length){tbl.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:#94a3b8">No properties found</td></tr>';pag.innerHTML='';return;}
  const pages = Math.ceil(filtered.length/PAGE);
  if (page>pages) page=pages;
  const items = filtered.slice((page-1)*PAGE, page*PAGE);
  tbl.innerHTML = items.map(p=>`
    <tr>
      <td><img src="${(p.images||[])[0]||'https://placehold.co/60'}" class="thumb"></td>
      <td>${escapeHtml(p.title)}</td>
      <td>${escapeHtml(p.city||'')}</td>
      <td>${fmtPrice(p.price)}</td>
      <td>${p.bedrooms||0}</td>
      <td>${p.bathrooms||0}</td>
      <td>${escapeHtml(p.type||'')}</td>
      <td>
        <a href="edit-property.html?id=${p.id}" class="action-btn edit"><i class="fa-solid fa-pen"></i> Edit</a>
        <button class="action-btn delete" data-del="${p.id}"><i class="fa-solid fa-trash"></i> Delete</button>
      </td>
    </tr>`).join('');
  pag.innerHTML = Array.from({length:pages},(_,i)=>`<button class="${i+1===page?'active':''}" data-pg="${i+1}">${i+1}</button>`).join('');
  tbl.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    if (!confirm('Delete this property?')) return;
    try { await deleteProperty(b.dataset.del); toast('Property deleted'); } catch { toast('Delete failed','error'); }
  }));
  pag.querySelectorAll('[data-pg]').forEach(b=>b.addEventListener('click',()=>{page=+b.dataset.pg;render();}));
}

function apply(){
  const q=document.getElementById('search').value.toLowerCase();
  const sort=document.getElementById('sort').value;
  filtered = all.filter(p=>!q || `${p.title} ${p.city} ${p.address}`.toLowerCase().includes(q));
  if (sort==='price-asc') filtered.sort((a,b)=>(a.price||0)-(b.price||0));
  if (sort==='price-desc') filtered.sort((a,b)=>(b.price||0)-(a.price||0));
  if (sort==='oldest') filtered.reverse();
  render();
}

document.getElementById('search').addEventListener('input',apply);
document.getElementById('sort').addEventListener('change',apply);

watchProperties(items=>{all=items;apply();});
</script>
</body>
</html>
