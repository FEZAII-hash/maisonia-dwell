<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Maisonia</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<header class="navbar scrolled">
  <div class="container nav-inner">
    <a href="index.html" class="logo">Maison<span>ia</span></a>
    <nav><ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="properties.html">Properties</a></li>
      <li><a href="favorites.html">Favorites</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="btn btn-primary">Login</a></li>
    </ul></nav>
    <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
  </div>
</header>

<section class="page-header"><div class="container"><h1>Get in Touch</h1><p>We'd love to help you find your next home.</p></div></section>

<section class="section">
  <div class="container contact-grid">
    <div>
      <h2 style="font-family:var(--display);margin-bottom:20px">Send us a message</h2>
      <form class="contact-form" id="contact-form">
        <input name="name" placeholder="Your full name" required>
        <input name="email" type="email" placeholder="Your email" required>
        <input name="phone" placeholder="Phone (optional)">
        <textarea name="message" rows="5" placeholder="Tell us how we can help…" required></textarea>
        <button class="btn btn-primary" type="submit">Send Message</button>
      </form>
    </div>
    <div>
      <div class="info-card"><div class="ico"><i class="fa-solid fa-location-dot"></i></div><div><strong>Address</strong><p style="color:var(--muted)">221B Madison Avenue, New York, NY</p></div></div>
      <div class="info-card"><div class="ico"><i class="fa-solid fa-phone"></i></div><div><strong>Phone</strong><p style="color:var(--muted)">+1 (212) 555-0114</p></div></div>
      <div class="info-card"><div class="ico"><i class="fa-solid fa-envelope"></i></div><div><strong>Email</strong><p style="color:var(--muted)">hello@maisonia.com</p></div></div>
      <div id="contact-map" style="margin-top:18px;height:300px"></div>
    </div>
  </div>
</section>

<footer><div class="container copyright" style="border:0">© 2026 Maisonia.</div></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { db, collection, addDoc, serverTimestamp } from './js/firebase-config.js';
import { navbarScroll, toast } from './js/ui.js';
import { renderSingleMap } from './js/map.js';
navbarScroll();
renderSingleMap('contact-map', 40.7549, -73.9840, 'Maisonia HQ');
document.getElementById('contact-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await addDoc(collection(db,'messages'), {
      name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone'),
      message: fd.get('message'), source:'contact-page', read:false, createdAt: serverTimestamp()
    });
    e.target.reset(); toast('Thank you! We will get back to you shortly.');
  } catch { toast('Failed to send message','error'); }
});
</script>
</body>
</html>
