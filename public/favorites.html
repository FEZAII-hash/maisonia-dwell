<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Favorites — Maisonia</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<header class="navbar scrolled">
  <div class="container nav-inner">
    <a href="index.html" class="logo">Maison<span>ia</span></a>
    <nav><ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="properties.html">Properties</a></li>
      <li><a href="favorites.html">Favorites</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="btn btn-primary">Login</a></li>
    </ul></nav>
    <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
  </div>
</header>

<section class="page-header"><div class="container"><h1>Your Saved Homes</h1><p>Properties you love, always within reach.</p></div></section>

<div class="container">
  <section class="section" style="padding-top:40px">
    <div class="grid" id="fav-grid"><div class="spinner"></div></div>
  </section>
</div>

<footer><div class="container copyright" style="border:0">© 2026 Maisonia.</div></footer>

<script type="module">
import { listProperties } from './js/properties.js';
import { navbarScroll, fmtPrice, escapeHtml, toast } from './js/ui.js';
import { getFavs, removeFav } from './js/favorites.js';
navbarScroll();
const FALLBACK='https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=800&q=80';
const grid=document.getElementById('fav-grid');

async function render() {
  const ids = getFavs();
  if (!ids.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><i class="fa-regular fa-heart"></i><p>No favorites yet. <a href="properties.html" style="color:var(--gold)">Explore properties</a>.</p></div>`;return;}
  const all = await listProperties();
  const items = all.filter(p=>ids.includes(p.id));
  if (!items.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><p>Your favorites are no longer available.</p></div>`;return;}
  grid.innerHTML = items.map(p=>`
    <article class="card" data-id="${p.id}">
      <div class="card-img"><img src="${(p.images||[])[0]||FALLBACK}" alt="${escapeHtml(p.title)}">
        <button class="card-fav active" data-rm="${p.id}"><i class="fa-solid fa-heart"></i></button></div>
      <div class="card-body">
        <div class="card-price">${fmtPrice(p.price)}</div>
        <h3 class="card-title">${escapeHtml(p.title)}</h3>
        <p class="card-address"><i class="fa-solid fa-location-dot"></i> ${escapeHtml(p.city||'')}</p>
        <div class="card-meta">
          <span><i class="fa-solid fa-bed"></i> ${p.bedrooms||0}</span>
          <span><i class="fa-solid fa-bath"></i> ${p.bathrooms||0}</span>
          <span><i class="fa-solid fa-ruler-combined"></i> ${p.area||0} m²</span>
        </div>
      </div>
    </article>`).join('');
  document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',e=>{
    if (e.target.closest('[data-rm]')) return;
    location.href=`property-details.html?id=${el.dataset.id}`;
  }));
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();removeFav(b.dataset.rm);toast('Removed from favorites');render();
  }));
}
render();
</script>
</body>
</html>
